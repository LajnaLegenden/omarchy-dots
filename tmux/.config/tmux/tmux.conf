set  -g default-terminal "screen"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

# rebind main key: C-k
unbind C-b
set -g prefix C-k
bind -N "Send the prefix key through to the application" \
  C-k send-prefix

set  -g mouse             off
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  24
set  -s escape-time       500
set  -g history-limit     2000

# ============================================= #
# Plugins (managed by TPM)                      #
# Install:  prefix + I   (or run ./install.sh)  #
# Was Nix-injected; ported to TPM for Omarchy.  #
# --------------------------------------------- #
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
# ============================================= #

set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -n M-H previous-window
bind -n M-L next-window

# Launch the sessionizer in a popup (fzf needs a TTY) and switch to the picked session.
# Resolves go-folder-finder via PATH (installed by ./install.sh into ~/.local/bin).
bind f display-popup -E -w 60% -h 60% "go-folder-finder run -backend fzf"

# Set automatic window renaming
set -g allow-rename on
set -g automatic-rename-format '#T'

# Set the outer terminal title to "tmux:<session>:<window>" so Waybar can
# detect a tmux session on a workspace (see window-rewrite in waybar modules.json).
set -g set-titles on
set -g set-titles-string "tmux:#S:#W"

# Source matugen colors. Quiet (-q) so this is a no-op until the theming version
# adds matugen back; the @matugen_* vars below stay unset (uncolored) for now.
source-file -q ~/.config/tmux/colors.conf

# Powerline statusline
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#{@matugen_inverse_surface},fg=#{@matugen_inverse_on_surface}"

# Left: session name (primary) + vim-style mode indicator (changes color per mode)
set -g status-left "#[bg=#{@matugen_primary},fg=#{@matugen_on_primary},bold]  #S #{?client_prefix,#[fg=#{@matugen_primary}#,bg=#{@matugen_error}]#[fg=#{@matugen_on_error}#,bg=#{@matugen_error}#,bold]  PREFIX ,#{?pane_in_mode,#[fg=#{@matugen_primary}#,bg=#{@matugen_tertiary}]#[fg=#{@matugen_on_tertiary}#,bg=#{@matugen_tertiary}#,bold]  COPY ,#[fg=#{@matugen_primary}#,bg=#{@matugen_secondary}]#[fg=#{@matugen_on_secondary}#,bg=#{@matugen_secondary}#,bold]  NORMAL }}#{?client_prefix,#[fg=#{@matugen_error}#,bg=#{@matugen_inverse_surface}],#{?pane_in_mode,#[fg=#{@matugen_tertiary}#,bg=#{@matugen_inverse_surface}],#[fg=#{@matugen_secondary}#,bg=#{@matugen_inverse_surface}]}} "
set -g status-left-length 50

# Right: cpu (secondary) + memory (tertiary) + time (primary_container) + date (primary)
set -g status-right "#[fg=#{@matugen_secondary_container},bg=#{@matugen_inverse_surface}]#[bg=#{@matugen_secondary_container},fg=#{@matugen_on_secondary_container}]  #{cpu_percentage} #[fg=#{@matugen_tertiary_container},bg=#{@matugen_secondary_container}]#[bg=#{@matugen_tertiary_container},fg=#{@matugen_on_tertiary_container}]  #{ram_percentage} #[fg=#{@matugen_primary_container},bg=#{@matugen_tertiary_container}]#[bg=#{@matugen_primary_container},fg=#{@matugen_on_primary_container},bold]  %H:%M #[fg=#{@matugen_primary},bg=#{@matugen_primary_container}]#[bg=#{@matugen_primary},fg=#{@matugen_on_primary},bold]  %a %d %b "
set -g status-right-length 100

# Window tabs
setw -g window-status-format "#[fg=#{@matugen_inverse_surface},bg=#{@matugen_surface_container_high}]#[fg=#{@matugen_on_surface},bg=#{@matugen_surface_container_high}] #I  #W #[fg=#{@matugen_surface_container_high},bg=#{@matugen_inverse_surface}]"
setw -g window-status-current-format "#[fg=#{@matugen_inverse_surface},bg=#{@matugen_secondary}]#[fg=#{@matugen_on_secondary},bg=#{@matugen_secondary},bold] #I  #W #[fg=#{@matugen_secondary},bg=#{@matugen_inverse_surface}]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#{@matugen_surface_container_high}"
set -g pane-active-border-style "fg=#{@matugen_primary}"

# Message / command prompt
set -g message-style "bg=#{@matugen_tertiary},fg=#{@matugen_on_tertiary}"
set -g message-command-style "bg=#{@matugen_secondary},fg=#{@matugen_on_secondary}"

# Clock
setw -g clock-mode-colour "#{@matugen_primary}"

# Initialize TPM — keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
