<!doctype html>
<meta charset="utf-8">
<title>camphouse</title>
<style>
  @keyframes chLogoFadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to   { opacity: 1; transform: scale(1); }
  }

  @keyframes chTextReveal {
    0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
    50%  { clip-path: inset(0 0% 0 0);   opacity: 1; }
    80%  { clip-path: inset(0 0% 0 0);   opacity: 1; }
    100% { clip-path: inset(0 100% 0 0); opacity: 0; }
  }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000000;
    cursor: none;
    overflow: hidden;
    font-family: system-ui, sans-serif;
  }

  .ch-loading__logo-wrapper {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .ch-loading__emblem {
    width: 160px;
    height: 160px;
    flex-shrink: 0;
    animation: chLogoFadeIn 0.6s ease-out both;
  }

  .ch-loading__text {
    font-size: 54px;
    color: #ffffff;
    letter-spacing: 1.1px;
    white-space: nowrap;
    animation: chTextReveal 6s ease-in-out 0.4s infinite;
  }

  .ch-loading__text-bold { font-weight: 700; }
  .ch-loading__text-light { font-weight: 300; }
</style>
