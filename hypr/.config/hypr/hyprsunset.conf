# Scheduling is handled by omarchy-nightlight-schedule (a systemd user timer),
# which fades the temperature via `hyprctl hyprsunset temperature`. hyprsunset
# switches profiles instantly, so a profile inside either fade would fight it.
#
# 09:00 always falls in the flat daytime stretch (the morning fade ends by 08:00
# at the latest, the evening one starts at 17:00 at the earliest), so this never
# collides -- it just leaves hyprsunset in a sane state on startup, and gives a
# safe landing spot if the timer ever stops running.
profile {
    time = 09:00
    temperature = 6500
}
